name: Submit an app
description: List your LabConstrictor app in the App Centre.
title: "Submit app: "
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Before you submit: your repository is public, has a license, contains a `labconstrictor-app.yaml`
        ([how to write one](https://labconstrictor.cellmig.org/submit/)), and your latest release carries the installers (if you offer them).
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The GitHub address of your app, for example https://github.com/owner/name
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am an author or maintainer of this app and I want it listed.
          required: true
        - label: I understand that downloads are served from my GitHub releases and that the listing pauses if the repository changes owner.
          required: true
