name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"      # daily: new releases of listed apps appear without a commit here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# One run per branch at a time; a newer pull-request build cancels an older one, but a deploy is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build never pushes; keep the token out of .git/config

      # The template's documentation and its pictures (the doc_source branch) are read, not copied.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CellMigrationLab/LabConstrictor
          path: build/template
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CellMigrationLab/LabConstrictor
          ref: doc_source
          path: build/doc_source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: PYTHONPATH=scripts:tests python -m unittest discover -s tests

      # Pull requests fail when any registered app cannot be resolved; scheduled and main builds
      # list what was left out (below) instead, so one broken app never takes the site down.
      - name: Fetch the catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_catalogue.py ${{ github.event_name == 'pull_request' && '--strict' || '' }}

      # Guides kept in other repositories (data/guides.yaml: `repo` and `path`): one file each, read from the default branch.
      - name: Fetch the guides of the other repositories
        run: python scripts/fetch_guides.py

      - name: Report left-out apps
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat build/problems.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^- .*/' <(sed -n '/^# Catalogue problems/,/^## Warnings/p' build/problems.md); then
            title="Catalogue: apps left out of the site"
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$number" ]; then gh issue comment "$number" --body-file build/problems.md
            else gh issue create --title "$title" --body-file build/problems.md; fi
          fi

      - name: Generate pages
        run: python scripts/build_site.py --template-dir build/template --doc-source-dir build/doc_source

      - name: Build site
        run: zensical build --strict

      - name: Sitemap, robots.txt and schemas
        run: python scripts/write_sitemap.py

      # Outside links in a new tab and lazy images, for Markdown that comes from other repositories.
      - name: Finish the built site
        run: python scripts/finish_site.py

      # Dead links, author text that is not escaped, missing files: stop here rather than publish them.
      - name: Check the built site
        run: python scripts/check_site.py

      # The design rules (DESIGN.md): metadata, headings, links, buttons, images.
      - name: Check the design rules
        run: python scripts/check_design.py

      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A failed daily build leaves the old site online and tells nobody: open (or update) an issue so someone looks.
  notify:
    if: always() && github.event_name == 'schedule' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the "daily build failed" issue
        run: |
          title="The daily site build failed"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The scheduled build failed, so the site was not updated: $RUN_URL. The log names the file to fix (a guide, picture, project file or manifest in one of the repositories the site reads)."
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
