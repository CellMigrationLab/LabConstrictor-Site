name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"      # daily: new releases of listed apps appear without a commit here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# One run per branch at a time; a newer pull-request build cancels an older one, but a deploy is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # the build never pushes; keep the token out of .git/config

      # The template's documentation and its pictures (the doc_source branch) are read, not copied.
      - uses: actions/checkout@v5
        with:
          repository: CellMigrationLab/LabConstrictor
          path: build/template
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: CellMigrationLab/LabConstrictor
          ref: doc_source
          path: build/doc_source
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: PYTHONPATH=scripts:tests python -m unittest discover -s tests

      # Pull requests fail when any registered app cannot be resolved; scheduled and main builds
      # list what was left out (below) instead, so one broken app never takes the site down.
      - name: Fetch the catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_catalogue.py ${{ github.event_name == 'pull_request' && '--strict' || '' }}

      - name: Report left-out apps
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat build/problems.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^- .*/' <(sed -n '/^# Catalogue problems/,/^## Warnings/p' build/problems.md); then
            title="Catalogue: apps left out of the site"
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$number" ]; then gh issue comment "$number" --body-file build/problems.md
            else gh issue create --title "$title" --body-file build/problems.md; fi
          fi

      - name: Generate pages
        run: python scripts/build_site.py --template-dir build/template --doc-source-dir build/doc_source

      - name: Build site
        run: zensical build --strict

      - name: Sitemap, robots.txt and schemas
        run: python scripts/write_sitemap.py

      # Dead links, author text that is not escaped, missing files: stop here rather than publish them.
      - name: Check the built site
        run: python scripts/check_site.py

      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
