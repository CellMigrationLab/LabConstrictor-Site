# Checks an app submission and opens a pull request that adds it to registry/.
# Safety: the issue text is untrusted. It is passed through an environment variable to a script
# that validates it with a strict pattern; it is never put into a shell command, and the
# submitted repository is only read through the GitHub API (never checked out or run).
name: Validate app submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'app-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the submission
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/submit_app.py
        continue-on-error: true

      - name: Post the result
        if: hashFiles('build/submission.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '\n---\n_Generated by the submission workflow_\n' >> build/submission.md
          gh issue comment "$NUMBER" --body-file build/submission.md

      # If the script crashed before it could write its report, say so instead of leaving the issue silent.
      - name: Say that the checks could not run
        if: steps.check.outcome == 'failure' && hashFiles('build/submission.md') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --body "The submission checks could not run. A maintainer will look at the workflow log."

      - name: Open the registry pull request
        if: steps.check.outcome == 'success'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: submission/${{ github.event.issue.number }}
          title: "Add app from issue #${{ github.event.issue.number }}"
          body: "Adds a registry entry for the app submitted in #${{ github.event.issue.number }}. Closes #${{ github.event.issue.number }}."
          commit-message: "Add app from issue #${{ github.event.issue.number }}"
          add-paths: registry/
