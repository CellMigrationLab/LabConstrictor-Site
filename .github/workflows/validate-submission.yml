# Checks an app submission and opens a pull request that adds it to registry/.
# Safety: the issue text is untrusted. It is passed through an environment variable to a script
# that validates it with a strict pattern; it is never put into a shell command, and the
# submitted repository is only read through the GitHub API (never checked out or run).
# The check (which parses the submitted manifest and pictures) runs with a read-only token; commenting and
# opening the pull request are separate jobs that only receive the check's result.
name: Validate app submission

on:
  issues:
    types: [opened, edited]

permissions: {}

# One check per issue at a time: a quick second edit replaces the run of the first.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'app-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.check.outcome == 'success' }}
      ran: ${{ steps.result.outputs.ran }}
      comment: ${{ steps.result.outputs.comment }}
      entry_file: ${{ steps.result.outputs.entry_file }}
      entry: ${{ steps.result.outputs.entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the submission
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/submit_app.py
        continue-on-error: true

      # The comment and the registry entry go to the next jobs as outputs. The comment holds text from the submitted
      # manifest, so each multi-line output ends with a random marker it cannot contain.
      - name: Hand the result to the next jobs
        id: result
        if: always()
        run: |
          if [ ! -f build/submission.md ]; then echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          end="END_$(openssl rand -hex 16)"
          { echo "ran=true"; echo "comment<<$end"; cat build/submission.md; echo "$end"; } >> "$GITHUB_OUTPUT"
          file=$(git ls-files --others --exclude-standard registry/)
          if [ -n "$file" ]; then
            { echo "entry_file=$file"; echo "entry<<$end"; cat "$file"; echo "$end"; } >> "$GITHUB_OUTPUT"
          fi

  comment:
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')   # not when a newer edit cancelled it
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Post the result
        if: needs.check.outputs.ran == 'true'
        env:
          COMMENT: ${{ needs.check.outputs.comment }}
        run: printf '%s\n\n---\n_Generated by the submission workflow_\n' "$COMMENT" | gh issue comment "$NUMBER" --body-file -

      # If the script crashed before it could write its report, say so instead of leaving the issue silent.
      - name: Say that the checks could not run
        if: needs.check.outputs.ran != 'true'
        run: gh issue comment "$NUMBER" --body "The submission checks could not run. A maintainer will look at the workflow log."

  pull-request:
    needs: check
    if: needs.check.outputs.passed == 'true' && needs.check.outputs.entry_file != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the registry entry
        env:
          ENTRY_FILE: ${{ needs.check.outputs.entry_file }}
          ENTRY: ${{ needs.check.outputs.entry }}
        run: |
          if ! printf '%s' "$ENTRY_FILE" | grep -Eq '^registry/[A-Za-z0-9_.-]+__[A-Za-z0-9_.-]+\.yaml$'; then
            echo "unexpected registry file name: $ENTRY_FILE" >&2; exit 1
          fi
          printf '%s\n' "$ENTRY" > "$ENTRY_FILE"

      # A pull request opened with the workflow's own token does not start other workflows, so the site build does not run
      # on it by itself; the body tells the maintainer how to start it.
      - name: Open the registry pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: submission/${{ github.event.issue.number }}
          title: "Add app from issue #${{ github.event.issue.number }}"
          body: |
            Adds a registry entry for the app submitted in #${{ github.event.issue.number }}. Closes #${{ github.event.issue.number }}.

            The site build does not start by itself on a pull request opened by a workflow. Before merging, close and reopen this pull request to run it.
          commit-message: "Add app from issue #${{ github.event.issue.number }}"
          add-paths: registry/
