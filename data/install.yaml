# How to install an app, per system, for every app. The template's download guide
# (LabConstrictor/.tools/templates/download_executable_template.md) is a different page: it carries one app's name and
# download buttons, so it cannot be imported. When the install steps change in the template, change them here too.
note: Installing takes about 6-8 minutes and you only do it once. A command prompt window opens during installation on Windows; this is normal, do not close it.
systems:
  - key: windows
    title: Windows
    steps:
      - Download the .exe file and double-click it.
      - If Windows shows "Windows protected your PC", click "More info" and then "Run anyway". The installers are not code-signed yet.
      - Follow the on-screen prompts. Launch the app from the Start Menu or your desktop.
  - key: macos
    title: macOS
    steps:
      - "Choose your file: open the Apple menu, then About This Mac. If the Chip or Processor says Intel, download the Intel installer; if it says M1, M2 or similar, download the Apple Silicon one."
      - Double-click the .pkg file. If macOS refuses to open it, go to System Settings, Privacy & Security, find the package and click "Open Anyway".
      - Follow the prompts (we recommend "Install only for me"). Launch the app from your Applications folder.
  - key: linux
    title: Linux
    steps:
      - Download the .sh file.
      - "Open a terminal in the download folder and run: bash <the file name>"
      - Follow the prompts, then launch the app from your applications menu.
