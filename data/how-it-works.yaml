# The "How LabConstrictor works" page (/how-it-works/): a quick overview of the whole process, one step at a time.
# Each step: a one-line summary (shown on the home page), what you do (text), what to remember (know), where you can customise (customise, may be empty) and the guides.
# No code and no interactive panels: the guides (linked from every step) do the detail. Every statement follows the guide it links to.
# Written here only; pages_how.py checks the exact keys and that every link goes to a page of the site.
title: How LabConstrictor works
lead: From a notebook that works on your computer to an app that colleagues can install, in five steps. Open one at a time; each links to the guides that show how.
steps_title: The five steps
steps:
  - id: step-1
    title: Build your notebook(s)
    summary: "Develop and test your analysis in a Jupyter notebook that runs in JupyterLab and, ideally, in Colab."
    text: Start with a notebook that already works for you. It is what your colleagues open in the installed app, so there is no separate interface to write.
    region: [6, 55, 820, 127]
    customise:
      - The notebook is your app's interface, so its text, widgets and layout are entirely yours.
    know:
      - "The app opens your notebooks in JupyterLab. Ideally they also run in Google Colab: put Colab-only setup inside a check for Colab, and use ipywidgets rather than Colab forms, which do not work in JupyterLab."
      - Paste the version cell from the guide at the top of each notebook, set current_version and notebook_name (the file name without .ipynb), and raise the version whenever the notebook's logic changes. The app's Welcome notebook uses it to offer updates.
      - By default, code cells are hidden in the installed app (users can show them with Show/Hide Code), so put what users must read in Markdown cells.
    guides:
      - {href: guides/notebook-portability/, label: Write notebooks that run in both Colab and JupyterLab}
      - {href: guides/code-hiding/, label: Hide code cells}
      - {href: "guides/notebook-upload/#1-prepare-your-notebook", label: Add the version cell}
  - id: step-2
    title: Create and initialise your repository
    summary: "Start from the GitHub template and give your app its name and version with the LabConstrictor web form."
    text: Start from the LabConstrictor template on GitHub, then fill in the LabConstrictor web form, which gives your project its name and version and proposes the changes as a pull request.
    region: [6, 188, 820, 199]
    customise:
      - Your app's name and version.
      - Your own logo (used by the installer and as the desktop icon) and the banner and header images shown in the installer.
      - Whether code cells are hidden or shown by default when users open a notebook.
      - "How the App Centre will describe your app (the form writes labconstrictor-app.yaml): a one-sentence summary, the kind of app, the software it also works in and an optional longer description."
    know:
      - You need a GitHub account. Your repository can be public or private. A private one keeps access in your hands, so only people with access can download its installers, and only a public repository can be listed in the App Centre.
      - Before you initialise it, complete the one-time template synchronisation setup, so that future template improvements can reach your repository.
      - "The form asks for a project name, an initial version such as 0.0.1, your GitHub repository URL and a personal access token (classic, starting with ghp_). This is not the same token as the one for template updates."
      - Accept the pull request that the form opens in your repository.
    guides:
      - {href: guides/create-repository/, label: Create your repository}
      - {href: guides/initialise-repository/, label: Initialise your repository}
      - {href: guides/template-synchronization/, label: Set up template updates}
      - {href: guides/personal-access-token/, label: Create a personal access token}
      - {href: guides/accept-pull-request/, label: Accept a pull request}
  - id: step-3
    title: Define your requirements
    summary: "List the packages each notebook needs in its own requirements.yaml file."
    text: Each notebook needs its own requirements.yaml, which lists the exact package versions it needs, its Python version and a short description.
    region: [6, 400, 820, 205]
    customise: []
    know:
      - Generate it with the Requirements Generator notebook, in the environment where your notebook runs without errors, on your computer or in Colab.
      - You can write the file by hand instead and check it with the Requirements Validator notebook.
      - Helper code can live in your repository's src folder, or come from a package installed with pip (list it in requirements.yaml).
    guides:
      - {href: guides/notebook-requirements/, label: Generate the requirements of your notebook}
      - {href: guides/external-code-upload/, label: Upload external code}
  - id: step-4
    title: Add your notebook(s)
    summary: "Upload each notebook and its requirements with the LabConstrictor web form; a workflow checks them."
    text: Upload your notebook and its requirements.yaml with the LabConstrictor web form, which opens a pull request in your repository.
    region: [6, 615, 820, 143]
    customise:
      - "Experimental: declare tools in a module named <package>_lc_tools next to your helper code in src, so that the napari, Fiji and QuPath plugins can run them. Only a development version of the installer registers them so far."
    know:
      - The form asks for your GitHub repository URL and a personal access token (classic) with write access. You can add several notebooks in one pull request.
      - After you merge the pull request, a workflow records the notebook's version and changelog, hides its code, and tests that the packages of all your notebooks install together.
      - If that test fails, the merge is undone automatically. Download the error log from the failed run's Artifacts, fix the notebook or its requirements and upload again.
      - To update a notebook later, raise its version and upload it again under exactly the same file name.
    guides:
      - {href: guides/notebook-upload/, label: Add or update a notebook}
      - {href: guides/personal-access-token/, label: Create a personal access token}
      - {href: guides/workflow-status/, label: Check the status of workflows}
      - {href: "https://github.com/CellMigrationLab/LabConstrictor-Tools/blob/main/docs/AUTHORING.md", label: "Declare tools for napari, Fiji and QuPath (experimental)"}
  - id: step-5
    title: Create a release and share it
    summary: "A release builds installers for Windows, macOS and Linux; share its link or list the app in the App Centre."
    text: Publish a release on GitHub, and a workflow builds the installers. Share the link to your release, and anyone who can see your repository can install the app from it.
    region: [6, 768, 820, 122]
    customise:
      - Add screenshots, a development status and the paper to cite to labconstrictor-app.yaml; the App Centre shows them on your app's page.
    know:
      - Before you start, check the Actions tab of your repository. No workflow should be running.
      - The release tag is a version number in the form MAJOR.MINOR.PATCH, for example 0.0.1. It becomes your app's version, so make it higher than the last one.
      - Each system gets its own installer, listed under the release's Assets when the workflow has finished, with a Welcome notebook that lists your notebooks and checks for updates. Try one yourself before you share it.
      - The installers are not code-signed yet, so users' systems will warn them. Tell them to download only from your release. Installing needs an internet connection.
      - To be found by others, submit your repository to the App Centre. It must be public and have a licence; the template's LICENSE file carries the Cell Migration Lab's copyright line, so put your own name in it.
    guides:
      - {href: guides/executable-creation/, label: Create installer files}
      - {href: guides/workflow-status/, label: Check the status of workflows}
      - {href: guides/install/, label: Install an app}
      - {href: guides/app-manifest/, label: Describe your app for the App Centre}
      - {href: submit/, label: Submit your app}
map:
  pipeline_file: pipeline.webp
  pipeline_alt: "The developer workflow of the preprint in five blocks: 1 prepare notebooks, optional helper code and an icon; 2 make a repository from the template and initialise it with a form; 3 generate requirements.yaml with the Requirements Generator notebook; 4 submit the notebook and its requirements, which creates a pull request and starts automation A; 5 create a release, which starts automation B and attaches installers for Windows, macOS and Linux."
  caption: "The block with the red frame is the step you are reading. A and B are the automatic workflows: A checks and prepares each notebook you add, B builds the installers."
figure_credit:
  text: "Adapted from Figure 2 of the LabConstrictor preprint (CC BY 4.0):"
  link: Hidalgo-Cenalmor et al., 2026
