# The "How LabConstrictor works" page (/how-it-works/): a quick overview of the whole process, one step at a time.
# Each step: what you do (text), what to remember (know), where you can customise (customise, may be empty) and the guides.
# No code and no interactive panels: the guides (linked from every step) do the detail. Every statement follows the guide it links to.
# Written here only; pages_how.py checks the exact keys and that every link goes to a page of the site.
title: How LabConstrictor works
lead: From a notebook that works on your computer to an app that colleagues can install, in six steps. Open one at a time; each links to the guides that show how.
steps_title: The six steps
steps:
  - id: step-1
    title: Build your notebook(s)
    text: Start with a notebook that already works for you. It is what your colleagues open in the installed app, so there is no separate interface to write.
    figure:
      file: step-1.webp
      alt: "A notebook file, a Python helper file and an icon image: the things an author prepares."
    customise:
      - The notebook is your app's interface: its text, widgets and layout are entirely yours.
    know:
      - Make it run in Google Colab and in JupyterLab. Setup that only works in Colab is guarded, so it runs only there.
      - Add a small version cell at the top (current_version and notebook_name), and raise the version whenever the notebook's logic changes. Installed apps use it to tell users about updates.
      - Code cells can be hidden in the installed app, so put what users must read in Markdown cells.
    guides:
      - {href: guides/notebook-portability/, label: Write notebooks that run in both Colab and JupyterLab}
      - {href: guides/code-hiding/, label: Hide code cells}
      - {href: guides/notebook-upload/, label: Add the version cell}
  - id: step-2
    title: Define your requirements
    text: Each notebook comes with a requirements.yaml that lists the packages it needs, its Python version and a short description.
    figure:
      file: step-2.webp
      alt: "The Requirements Generator notebook scans the notebook and its helper code and writes a requirements.yaml file listing the Python version and the packages."
    customise: []
    know:
      - Generate it with the Requirements Generator notebook, in the environment where your notebook runs without errors, on your computer or in Colab.
      - You can write the file by hand instead and check it with the Requirements Validator notebook.
      - Helper code can live in your repository's src folder or in a package installed with pip.
    guides:
      - {href: guides/notebook-requirements/, label: Generate the requirements of your notebook}
      - {href: guides/external-code-upload/, label: Upload external code}
  - id: step-3
    title: Create your repository
    text: Start from the LabConstrictor template on GitHub, then fill in a short form that gives your project its name and version.
    figure:
      file: step-3.webp
      alt: "The LabConstrictor template on GitHub is used to make a custom repository; an initialiser form takes a project name, a version and an optional icon, and sends the changes to the repository as a pull request."
    customise:
      - Your app's name and version.
      - Your own logo, banner and header images for the installer and the desktop app. You can also add them later.
      - Whether code cells are hidden or shown by default when users open a notebook.
    know:
      - You need a GitHub account. Your repository can be public or private. A private one keeps access in your hands, but only a public repository can be listed in the App Centre.
      - Before you initialise it, complete the one-time template synchronisation setup, so that future template improvements can reach your repository.
      - Have ready a project name, an initial version such as 0.1.0, a one-sentence summary and the kind of app. Your own logo and installer images are optional.
      - The form opens a pull request in your repository, which you accept.
    guides:
      - {href: guides/create-repository/, label: Create your repository}
      - {href: guides/initialise-repository/, label: Initialise your repository}
      - {href: guides/template-synchronization/, label: Set up template updates}
      - {href: guides/accept-pull-request/, label: Accept a pull request}
  - id: step-4
    title: Add your notebook
    text: Upload your notebook and its requirements.yaml with the LabConstrictor web form, which opens a pull request in your repository.
    figure:
      file: step-4.webp
      alt: "A form takes the notebook and the requirements.yaml file and creates a pull request in the custom repository, which starts the automatic checks."
    customise: []
    know:
      - The form asks for your repository address and a GitHub personal access token. You can add several notebooks in one pull request.
      - After you merge the pull request, a workflow checks the notebook and its dependencies.
      - If the check fails, the merge is undone automatically. Read the log, fix the notebook or its requirements and upload again.
    guides:
      - {href: guides/notebook-upload/, label: Add or update a notebook}
      - {href: guides/personal-access-token/, label: Create a personal access token}
      - {href: guides/workflow-status/, label: Check the status of workflows}
  - id: step-5
    title: Create a release
    text: Publishing a release on GitHub starts a workflow that builds the installers.
    figure:
      file: step-5.webp
      alt: "A new release with a version tag in the custom repository starts the automation, which attaches installers for Windows, macOS and Linux to the release's assets."
    customise: []
    know:
      - Before you start, check the Actions tab of your repository. No workflow should be running.
      - The release tag is a version number in the form MAJOR.MINOR.PATCH, for example 0.0.1.
      - Each system gets its own installer, listed under the release's Assets when the workflow has finished.
      - Try an installer yourself before you share it.
    guides:
      - {href: guides/executable-creation/, label: Create installer files}
      - {href: guides/workflow-status/, label: Check the status of workflows}
      - {href: guides/install/, label: Install an app}
  - id: step-6
    title: Share your app
    text: Share the link to your release and anyone can install the app from it. To be found by others, describe the app and list it in the App Centre.
    figure:
      file: step-6.webp
      alt: "What users get: an installer for each system, the installed app with its icon, and JupyterLab opening a Welcome notebook that lists the notebooks, with code hidden and widgets shown."
    customise:
      - How the App Centre describes your app: its summary, kind, status, screenshots and the paper to cite.
    know:
      - Users download the installer for their system from your release. The installers are not code-signed yet, so their system will warn them: tell them to download only from your release. Installing needs an internet connection.
      - Describing the app takes one small file in your repository, labconstrictor-app.yaml. The initialisation form adds it if you fill in its summary and kind; otherwise you copy the example from the guide.
      - To be listed, the repository must be public and have a licence. Submit its address; a bot checks it and a maintainer adds it.
    guides:
      - {href: guides/app-manifest/, label: Describe your app for the App Centre}
      - {href: submit/, label: Submit your app}
