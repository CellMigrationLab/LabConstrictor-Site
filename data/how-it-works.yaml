# The "How LabConstrictor works" page (/how-it-works/): a quick overview of the whole process, one step at a time.
# Each step: a one-line summary (shown on the Build hub), one sentence on what the step is (text) and a numbered "What to do" list (do):
# concrete actions, each with the guide that shows how (href and label; an action that needs no guide has text only).
# What can be customised is listed once, after the last step (make_it_yours).
# No code and no interactive panels: the guides (linked from every step) do the detail. Every statement follows the guide it links to.
# Written here only; pages_how.py checks the exact keys and that every link goes to a page of the site.
title: How LabConstrictor works
lead: From a notebook that works on your computer to an app that colleagues can install, in five steps. Open one at a time; each links to the guides that show how.
steps_title: The five steps
steps:
  - id: step-1
    title: Build your notebook(s)
    summary: "Develop and test your analysis in a Jupyter notebook that runs in JupyterLab and, ideally, in Colab."
    text: Start with a notebook that already works for you. It is what your colleagues open in the installed app, so there is no separate interface to write.
    region: [6, 55, 820, 127]
    do:
      - text: "Make sure each notebook runs from top to bottom in JupyterLab, and ideally in Google Colab too: keep Colab-only setup inside a check for Colab, and use ipywidgets rather than Colab forms."
        href: guides/notebook-portability/
        label: Write notebooks that run in both Colab and JupyterLab
      - text: "Paste the version cell at the top of each notebook, fill in current_version and notebook_name (the file name without .ipynb), and raise the version whenever the notebook's logic changes. The app's Welcome notebook uses it to offer updates."
        href: "guides/notebook-upload/#1-prepare-your-notebook"
        label: Add the version cell
      - text: "Put what users must read in Markdown cells: code cells are hidden by default in the installed app, and users can show them with Show/Hide Code."
        href: guides/code-hiding/
        label: Hide code cells
  - id: step-2
    title: Create and initialise your repository
    summary: "Start from the GitHub template and give your app its name and version with the LabConstrictor web form."
    text: Your app lives in a GitHub repository made from the LabConstrictor template. A web form gives it its name and version.
    region: [6, 188, 820, 199]
    do:
      - text: "Create your repository from the LabConstrictor template on GitHub (you need a GitHub account). It can be public or private: only people with access to a private repository can download its installers, and only a public one can be listed in the App Centre."
        href: guides/create-repository/
        label: Create your repository
      - text: Set up template updates once, before you initialise the repository, so that future improvements of the template can reach it.
        href: guides/template-synchronization/
        label: Set up template updates
      - text: "Create a personal access token for the web form (classic, starting with ghp_). It is not the same token as the one for template updates."
        href: guides/personal-access-token/
        label: Create a personal access token
      - text: "Fill in the LabConstrictor web form: your project's name, an initial version such as 0.0.1, your repository's URL and the token. The form can also write how the App Centre will describe your app."
        href: guides/initialise-repository/
        label: Initialise your repository
      - text: Accept the pull request that the form opens in your repository.
        href: guides/accept-pull-request/
        label: Accept a pull request
  - id: step-3
    title: Define your requirements
    summary: "List the packages each notebook needs in its own requirements.yaml file."
    text: Each notebook needs its own requirements.yaml, which lists the exact package versions it needs, its Python version and a short description.
    region: [6, 400, 820, 205]
    do:
      - text: Run the Requirements Generator notebook in the environment where your notebook works without errors, on your computer or in Colab. It writes requirements.yaml for you.
        href: guides/notebook-requirements/
        label: Generate the requirements of your notebook
      - text: If you prefer to write the file by hand, check it with the Requirements Validator notebook.
      - text: "Keep helper code in your repository's src folder, or use a package installed with pip (list it in requirements.yaml)."
        href: guides/external-code-upload/
        label: Upload external code
  - id: step-4
    title: Add your notebook(s)
    summary: "Upload each notebook and its requirements with the LabConstrictor web form; a workflow checks them."
    text: Each notebook and its requirements.yaml go into your repository through the LabConstrictor web form, which opens a pull request.
    region: [6, 615, 820, 143]
    do:
      - text: "Upload each notebook with its requirements.yaml in the web form, with your repository's URL and a personal access token (classic) with write access. Several notebooks can go in one pull request."
        href: guides/notebook-upload/
        label: Add or update a notebook
      - text: "Merge the pull request. A workflow then records each notebook's version and changelog, hides its code and tests that the packages of all your notebooks install together."
        href: guides/workflow-status/
        label: Check the status of workflows
      - text: "If that test fails, the merge is undone automatically: download the error log from the failed run's Artifacts, fix the notebook or its requirements and upload again."
      - text: To update a notebook later, raise its version and upload it again under exactly the same file name.
        href: "guides/notebook-upload/#how-to-update-an-existing-notebook"
        label: Update a notebook
  - id: step-5
    title: Create a release and share it
    summary: "A release builds installers for Windows, macOS and Linux; share its link or list the app in the App Centre."
    text: A release on GitHub builds an installer for each system. You share the release, and anyone who can see your repository can install the app from it.
    region: [6, 768, 820, 122]
    do:
      - text: "Check the Actions tab of your repository: no workflow should be running."
        href: guides/workflow-status/
        label: Check the status of workflows
      - text: "Publish a release whose tag is a version number in the form MAJOR.MINOR.PATCH (for example 0.0.1), higher than the last one. It becomes your app's version, and a workflow builds the installers."
        href: guides/executable-creation/
        label: Create installer files
      - text: "When the workflow has finished, download the installer for your system from the release's Assets and try it yourself. It comes with a Welcome notebook that lists your notebooks and checks for updates."
        href: guides/install/
        label: Install an app
      - text: "Share the link to your release. The installers are not code-signed yet, so tell people to download only from your release; installing needs an internet connection."
      - text: "To be found by others, submit your repository to the App Centre. It must be public and have a licence: the template's LICENSE file carries the Cell Migration Lab's copyright line, so put your own name in it."
        href: submit/
        label: Submit your app
make_it_yours:
  title: Make it yours (optional)
  items:
    - text: Your own logo (the installer and desktop icon) and the banner and header images shown in the installer.
      href: guides/installer-images/
      label: Add your own logo and installer images
    - text: Whether code cells are hidden or shown by default when users open a notebook.
      href: guides/code-hiding/
      label: Hide code cells
    - text: "What the App Centre shows on your app's page: screenshots, the development status, what it works with and the paper to cite (labconstrictor-app.yaml)."
      href: guides/app-manifest/
      label: Describe your app for the App Centre
    - text: "Experimental: tools that the napari, Fiji and QuPath plugins can run, declared in a module named <package>_lc_tools next to your helper code. Only a development version of the installer registers them so far."
      href: "https://github.com/CellMigrationLab/LabConstrictor-Tools/blob/main/docs/AUTHORING.md"
      label: "Declare tools for napari, Fiji and QuPath"
map:
  pipeline_file: pipeline.webp
  pipeline_alt: "The developer workflow of the preprint in five blocks: 1 prepare notebooks, optional helper code and an icon; 2 make a repository from the template and initialise it with a form; 3 generate requirements.yaml with the Requirements Generator notebook; 4 submit the notebook and its requirements, which creates a pull request and starts automation A; 5 create a release, which starts automation B and attaches installers for Windows, macOS and Linux."
  caption: "The block with the red frame is the step you are reading. A and B are the automatic workflows: A checks and prepares each notebook you add, B builds the installers."
figure_credit:
  text: "Adapted from Figure 2 of the LabConstrictor preprint (CC BY 4.0):"
  link: Hidalgo-Cenalmor et al., 2026
  href: https://doi.org/10.48550/arXiv.2603.10704
later:
  title: When you need more
  links:
    - {href: "guides/notebook-upload/#how-to-update-an-existing-notebook", label: Update a notebook}
    - {href: guides/template-synchronization/, label: Keep up with template updates}
handoff:
  text: "Your release has installers. See what the people who use your app do with them: install it, then open it."
  link: Try the demo
  href: demo/
