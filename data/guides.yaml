# Guides for people who use apps ("Use an app" track), in sidebar order. The guides for people who build apps
# are imported from LabConstrictor/.tools/docs ("Build an app" track) and never copied here.
#   file:      hand-written here, in content/guides/ (this repository is the only place it exists)
#   repo/path: kept in another repository (a user guide next to the code it describes); fetched at build time by
#              scripts/fetch_guides.py, titled by its first '# Heading'. Adding a module = adding one line here.
#   template:  a page of the template's docs that is for users, shown here; title and text stay in the template
#              (the build stops if the template no longer has it)
sections:
  - title: Install and open
    items:
      - {template: install.md}
      - {slug: using-apps, title: Open and use an app, file: using-apps.md}
      - {template: notebook_usage.md}
      - {template: troubleshooting_installed_app.md}
  - title: Use apps in your image software
    items:
      - {slug: image-software, repo: CellMigrationLab/LabConstrictor-Tools, path: docs/user-guide.md}
      - {slug: napari, repo: CellMigrationLab/napari-labconstrictor, path: docs/user-guide.md}
      - {slug: fiji, repo: CellMigrationLab/LabConstrictor-Fiji, path: docs/user-guide.md}
      - {slug: qupath, repo: CellMigrationLab/LabConstrictor-QuPath, path: docs/user-guide.md}
