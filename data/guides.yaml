#   template:  a page of the template's docs that is for users, shown here; title and text stay in the template
#              (the build stops if the template no longer has it)
sections:
  - title: Install and open
    items:
      - {slug: install, title: Install an app, generated: true}
      - {slug: using-apps, title: Open and use an app, file: using-apps.md}
      - {template: notebook_usage.md}
  - title: Use apps in your image software
    items:
      - {slug: image-software, title: How it works, file: image-software.md}
      - {slug: napari, title: Install the napari plugin, file: napari.md}
      - {slug: fiji, title: Install the Fiji plugin, file: fiji.md}
      - {slug: qupath, title: Install the QuPath extension, file: qupath.md}
