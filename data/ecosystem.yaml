# The projects around LabConstrictor, in tiers. Each project describes itself (name, summary, status, optional url)
# in docs/labconstrictor-project.yaml in its own repository (schema/labconstrictor-project.schema.json); this file only
# says which repositories to list and under which heading. Adding a project = adding one `- repo: owner/name` line.
# The card links to the project's guide on this site automatically when data/guides.yaml has one for that repository.
# Exception: the template is copied into every app repository, so its card is written here.
tiers:
  - key: hosts
    title: Use apps inside your image software
    text: Apps can expose tools (typed Python functions) that run in the software you already use. These plugins are untested and under heavy construction.
    items:
      - repo: CellMigrationLab/napari-labconstrictor
      - repo: CellMigrationLab/LabConstrictor-Fiji
      - repo: CellMigrationLab/LabConstrictor-QuPath
  - key: dev
    title: Build and maintain apps
    text: What authors use to make and keep an app.
    items:
      - repo: CellMigrationLab/LabConstrictor
        name: LabConstrictor template
        text: The GitHub template that turns notebooks into installers, with automatic template updates.
        status: Available
      - repo: CellMigrationLab/LabConstrictor_streamlit
      - repo: CellMigrationLab/LabConstrictor-Tools
