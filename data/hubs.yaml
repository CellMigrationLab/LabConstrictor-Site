# The two hub pages: /use/ (people who use apps) and /build/ (people who make them).
# Every picture is `doc_source: <file in the template's doc_source branch>` or `repo` + `path` (a file kept in
# another repository, fetched by scripts/fetch_guides.py). Every picture needs an `alt`. Keep each claim true of
# what the template builds today; the guides they link to are the proof.
docs:
  title: Docs
  lead: Use an app someone built, or build your own.
use:
  title: Use an app
  lead: Install an app on your computer, open it, and, for apps that declare tools, try them in napari, Fiji or QuPath (experimental).
  cards:
    - title: Install it
      text: Download the installer for your system. It takes a few minutes and you only do it once. Windows and macOS warn about unsigned installers; the guide shows how to continue.
      href: guides/install/
      link: Install an app
      image: {doc_source: Windows_Protected_your_PC.png}
      alt: The two Windows "protected your PC" dialogs, with More info and then Run anyway marked in red.
    - title: Open it and work
      text: The app opens in your browser with a Welcome notebook. Run its first cell to list the app's notebooks, pick one and follow the instructions written in it.
      href: guides/using-apps/
      link: Open and use an app
      image: {doc_source: Welcome_Notebook.png}
      alt: The Welcome notebook in JupyterLab, with a table of the app's notebooks under orange header cells and a blue Open the notebook button.
    - title: Use it in your image software (experimental)
      text: An app's declared tools can run in napari, Fiji and QuPath through experimental plugins; this needs a development version of the template. The picture is a prototype.
      href: guides/image-software/
      link: Use apps in your image software
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/N2_napari_form.png}
      alt: "Prototype: napari with the LabConstrictor tools dock open on NucleiSky's Relocalize 2D tool, showing a form generated from the tool's declaration."
    - title: Connect it to a microscope
      text: "An example from NucleiSky, written by its authors for a Nikon microscope with NIS-Elements JOBS: scan a large area, find where a query image sits in it, then acquire there. Their guide says the same principles apply to other microscopes and software."
      href: guides/microscope/
      link: Connect NucleiSky to a microscope
      image: {repo: CellMigrationLab/NucleiSky, path: docs/smart_microscopy/assets/JOBS_NucleiSky.png}
      alt: The NucleiSky job loaded in NIS-Elements JOBS, a list of acquisition, autofocus and analysis steps.
  demo:
    title: Want to see it first?
    text: "A hands-on preview with example data: install an app on Windows, then open it in the notebook and in experimental napari and Fiji views."
    href: demo/
    link: Try the demo
build:
  title: Build an app
  lead: Turn your Jupyter notebooks into an app that anyone can install with a download. You write notebooks; LabConstrictor builds the installers.
  cards:
    - title: Your users need only a download
      text: One GitHub release builds installers for Windows, macOS and Linux. Your users have no Python or pip to set up.
      href: guides/install/
      link: How users install
      image: {doc_source: Windows_App.png}
      alt: A Windows Start menu search that finds the installed app next to its Open and Pin to Start actions.
    - title: It feels like an app, not a script
      text: It opens in the browser with a Welcome notebook, and you can hide the code cells so users see only the interface.
      href: guides/code-hiding/
      link: Hide code cells
      image: {doc_source: Welcome_Notebook.png}
      alt: The Welcome notebook in JupyterLab, with a table of the app's notebooks under orange header cells and a blue Open the notebook button.
    - title: It carries your logo
      text: Put your own logo, banner and header images in the installer and the desktop app.
      href: guides/installer-images/
      link: Customise the installer images
      image: {doc_source: Customisation_Custom.png}
      alt: The installer with a custom logo, banner and header, each labelled.
    - title: Its notebooks can also run in Colab
      text: Write them for both, and people can try them in the browser first.
      href: guides/notebook-portability/
      link: Notebooks for Colab and JupyterLab
      image: {doc_source: colab_vs_local/colab.png}
      alt: A notebook form in Google Colab with a model chooser and a Hide code button.
    - title: Others can find it
      text: List it in the App Centre, with a download for each system and a page of its own.
      href: submit/
      link: Submit your app
      live_card: true
    - title: It can reach napari, Fiji and QuPath (experimental)
      text: An app's declared tools can run in those programs through experimental plugins; this needs a development version of the template.
      href: guides/image-software/
      link: Use apps in your image software
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/F2_fiji_form_top.png}
      alt: Fiji with a dialog generated from a tool's declaration, next to an image of bright spots.
  flow_title: How it works
  how:
    title: Want to see how it works inside?
    text: A quick overview, one step at a time, from a notebook to an app that people can install.
    href: how-it-works/
    link: How LabConstrictor works
