# The hub pages: /use/ (people who use apps), /build/ (people who make them) and /connect/ (people who make an app's tools
# run in napari, Fiji and QuPath).
# Every picture is `doc_source: <file in the template's doc_source branch>` or `repo` + `path` (a file kept in
# another repository, fetched by scripts/fetch_guides.py). Every picture needs an `alt`. Keep each claim true of
# what the template builds today; the guides they link to are the proof.
docs:
  title: Docs
  lead: Use an app someone built, build your own, or connect it to napari, Fiji and QuPath.
  help: &help
    title: Something not working?
    text: Start from what you see, an error or a step that fails, and go to the page that fixes it.
    href: guides/help/
    link: Find your problem
use:
  title: Use an app
  lead: Install an app on your computer, open it, and, for apps that declare tools, try them in napari, Fiji or QuPath.
  cards:
    - title: Install it
      text: Download the installer for your system. It takes a few minutes and you only do it once. Windows and macOS warn about unsigned installers; the guide shows how to continue.
      href: guides/install/
      link: Install an app
      image: {doc_source: Windows_Protected_your_PC.png}
      alt: The two Windows "protected your PC" dialogs, with More info and then Run anyway marked in red.
    - title: Open it and work
      text: The app opens in your browser with a Welcome notebook. Run its first cell to list the app's notebooks, pick one and follow the instructions written in it.
      href: guides/using-apps/
      link: Open and use an app
      image: {doc_source: Welcome_Notebook.png}
      alt: The Welcome notebook in JupyterLab, with a table of the app's notebooks under orange header cells and a blue Open the notebook button.
    - title: Use it in your image software
      text: An app's declared tools can run in napari, Fiji and QuPath through their plugins. The picture shows the napari plugin.
      href: guides/image-software/
      link: Use apps in your image software
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/N2_napari_form.png}
      alt: "napari with the LabConstrictor tools dock open on NucleiSky's Relocalize 2D tool, showing a form generated from the tool's declaration."
    - title: Connect it to a microscope
      text: "An example from NucleiSky, written by its authors for a Nikon microscope with NIS-Elements JOBS: scan a large area, find where a query image sits in it, then acquire there. Their guide says the same principles apply to other microscopes and software."
      href: guides/microscope/
      link: "Example: connect NucleiSky to a microscope"
      image: {repo: CellMigrationLab/NucleiSky, path: docs/smart_microscopy/assets/JOBS_NucleiSky.png}
      alt: The NucleiSky job loaded in NIS-Elements JOBS, a list of acquisition, autofocus and analysis steps.
  demo:
    title: Want to see it first?
    text: "A hands-on preview with example data: install an app on Windows or macOS, then open it in the notebook, in napari and in Fiji."
    href: demo/
    link: Try the demo
build:
  title: Build an app
  lead: Turn your Jupyter notebooks into an app that anyone can install with a download. You write notebooks; LabConstrictor builds the installers.
  cards:
    - title: Your users need only a download
      text: One GitHub release builds an installer for each system your app lists (Windows, macOS, Linux). Your users have no Python or pip to set up.
      href: guides/install/
      link: How users install
      image: {doc_source: Windows_App.png}
      alt: A Windows Start menu search that finds the installed app next to its Open and Pin to Start actions.
    - title: It feels like an app, not a script
      text: It opens in the browser with a Welcome notebook, and you can hide the code cells so users see only the interface.
      href: guides/code-hiding/
      link: Hide code cells
      image: {doc_source: Welcome_Notebook.png}
      alt: The Welcome notebook in JupyterLab, with a table of the app's notebooks under orange header cells and a blue Open the notebook button.
    - title: It carries your logo
      text: Put your own logo, banner and header images in the installer and the desktop app.
      href: guides/installer-images/
      link: Customise the installer images
      image: {doc_source: Customisation_Custom.png}
      alt: The installer with a custom logo, banner and header, each labelled.
    - title: Its notebooks can also run in Colab
      text: Write them for both, and people can try them in the browser first.
      href: guides/notebook-portability/
      link: Notebooks for Colab and JupyterLab
      image: {doc_source: colab_vs_local/local_option2.png}
      alt: "A notebook cell written with ipywidgets, which work in both Colab and JupyterLab: a model dropdown, a Confirm Selection button and the line You selected: Model A."
    - title: Others can find it
      text: List it in the App Centre, with a download for each system and a page of its own.
      href: submit/
      link: Submit your app
      live_card: true
    - title: It can reach napari, Fiji and QuPath
      text: An app's declared tools can run in those programs through their plugins.
      href: connect/
      link: Connect an app
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/F2_fiji_form_top.png}
      alt: Fiji with a dialog generated from a tool's declaration, next to an image of bright spots.
  flow_title: The five steps
  why_title: What your app gets
  how:
    title: Want to see how it works inside?
    text: A quick overview, one step at a time, from a notebook to an app that people can install.
    href: how-it-works/
    link: How LabConstrictor works
  help: *help
connect:
  title: Connect an app
  lead: Declare your app's analyses once, in Python, and they run in napari, Fiji and QuPath through their plugins, with a form, results drawn on the image and a table.
  cards:
    - title: Start here
      text: "Add tools to an app you already have: declare them in its src folder, and the app's installer registers them for the plugins."
      href: guides/tools-bridge/
      link: Expose your app's tools
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/N5_napari_aligned_over_reference.png}
      alt: "napari showing a tool's result drawn over the reference image."
    - title: Declare a tool, get a form
      text: A typed Python function becomes a tool. Each plugin builds the form from its declaration, so you write no interface code.
      href: guides/writing-tools/
      link: Write tools
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/N4_napari_result.png}
      alt: napari with the LabConstrictor tools panel open on NucleiSky's Relocalize 2D tool, a form of images, pixel sizes and segmentation settings, with the result of the run under the Run button.
    - title: One menu entry in each program
      text: The plugins list every installed app that declares tools. Each program's guide says what it does with each kind of input and result.
      href: guides/host-features/
      link: What each host does
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/F0_fiji_menu.png}
      alt: "Fiji's Plugins menu with the LabConstrictor entry open on LabConstrictor Tools."
    - title: Errors people can act on
      text: A tool that fails reports a sentence, a code and the run record, so the person, or you, can see what went wrong.
      href: guides/tools-operations/
      link: Troubleshoot
      image: {repo: CellMigrationLab/LabConstrictor-Tools, path: docs/img/F8_fiji_error_dialog.png}
      alt: "A Fiji error dialog for a failed run: the message cannot read fake.tif, not a TIFF file, then the last lines of the worker, the run record and the log file."
  help: *help
