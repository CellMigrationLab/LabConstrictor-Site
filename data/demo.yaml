# Wording of the interactive demo (/demo/) and its home-page tile. The numbers shown in the three windows are NOT here:
# they come from content/demo/example.json (written by tools/demo_assets/make_demo_assets.py), so they are never typed twice.
title: Try the demo
description: A hands-on preview of a NucleiSky microscopy registration in a notebook, napari and Fiji. The result is precomputed and nothing runs in your browser.
lead: Explore how the same NucleiSky microscopy workflow appears in a notebook, napari and Fiji.
tile:
  title: See how LabConstrictor works
  text: Open a simulated notebook, napari or Fiji and watch a real microscopy registration result appear. Nothing to install.
  link: Try the demo
  alt: A microscopy field of green nuclei with the aligned small image outlined in yellow
about:
  title: About the example
  text: This demo uses NucleiSky as its example. NucleiSky is an open-source tool that aligns microscopy images by matching the arrangement of cell nuclei, like stars in a constellation. It finds where a small image sits inside a large one and estimates the rotation, scale and shift. The small image here is a random crop generated from the large one, so the correct answer is known. NucleiSky is one app built with LabConstrictor; every app has its own notebooks.
  app_link: Open the NucleiSky page
features:
  title: What you can try
  items:
    - title: Launch the app
      text: An installed app runs on your own computer and opens in your browser.
      href: guides/install/
      link: Install an app
    - title: Browse its notebooks
      text: The Welcome notebook lists the notebooks of the app, each with an Open the notebook button.
      href: guides/notebook-usage/
      link: Use notebooks after installation
    - title: Check for updates
      text: The same page compares your notebooks with the latest versions and updates them with one click.
      href: guides/notebook-usage/
      link: Use notebooks after installation
    - title: Show or hide code, run cells
      text: Authors can hide the code so users see only the interface; the play buttons run each cell.
      href: guides/code-hiding/
      link: Hide code cells
    - title: Use the same tool in napari and Fiji
      text: Apps that declare tools can run inside napari and Fiji (experimental).
      href: guides/image-software/
      link: Use apps in your image software
notice: Interactive preview using example data. The result is precomputed; nothing is computed on this website.
experimental: Experimental preview. The NucleiSky tool shown here is not in the released NucleiSky app, which lists notebook support only; it exists on development branches. So far it has been tested on Linux only, not on Windows or macOS. Expect bugs and changes.
how:
  title: How the connection works
  steps:
    - A LabConstrictor app is installed on the user's computer.
    - In the experimental version of the installer, an app that ships a tools module is registered on the computer at install time.
    - LabConstrictor-Tools exposes the scientific functions the app declares.
    - napari or Fiji builds its own form from those declarations.
    - The tool runs in the app's own Python environment, in a separate worker process.
    - The results come back to napari or Fiji as images, layers, overlays, points or tables.
  note: This website does not connect to a Fiji or napari running on your computer. Everything on this page is a simulation built from one precomputed result.
credit:
  data: "Images: Dataset 1 from Hidalgo Cenalmor I. et al., Data associated with NucleiSky enables cross-scale multimodal registration of microscopy data using nuclei constellations (a tiled widefield image of a DAPI-stained HUVEC monolayer), Zenodo, licensed CC BY 4.0. Changes: contrast-stretched, enlarged and cropped; the small image is a software-generated crop that was rotated and rescaled; overlays computed by NucleiSky."
  dataset_doi: 10.5281/zenodo.20721416
  paper_doi: 10.1242/jcs.265152
  nucleisky_repo: CellMigrationLab/NucleiSky
  tools_repo: CellMigrationLab/LabConstrictor-Tools
