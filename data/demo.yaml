other_systems:
  text: "On macOS you open a .pkg file instead (and may need Open Anyway in Privacy & Security the first time); on Linux you run the .sh file with bash in a terminal."
  link: Install guide for every system
  href: guides/install/
about:
  title: About the example
  text: This demo uses NucleiSky as its example. NucleiSky is an open-source tool that aligns microscopy images by matching the arrangement of cell nuclei, like stars in a constellation. It finds where a small image sits inside a large one and estimates the rotation, scale and shift. The small image here is a random crop generated from the large one, so the correct answer is known. NucleiSky is one app built with LabConstrictor; every app has its own notebooks.
  app_link: Open the NucleiSky page
experimental: Experimental preview. The NucleiSky tool shown here is not in the released NucleiSky app, which lists notebook support only; it exists on development branches. Expect bugs and changes.
how:
  title: How the connection works
  steps:
    - A LabConstrictor app is installed on the user's computer.
    - In the experimental version of the installer, an app that ships a tools module is registered on the computer at install time.
    - LabConstrictor-Tools exposes the scientific functions the app declares.
    - napari or Fiji builds its own form from those declarations.
    - The tool runs in the app's own Python environment, in a separate worker process.
    - The results come back to napari or Fiji as images, layers, overlays, points or tables.
  hosts_title: The same installed app, three programs
  hosts:
    - name: napari
      where: Plugins > LabConstrictor tools
      detail: Results come back as layers, overlays and tables. Shown on this page.
    - name: Fiji
      where: Plugins > LabConstrictor > LabConstrictor Tools...
      detail: Results come back as image windows, overlays and tables. Shown on this page.
    - name: QuPath
      where: Extensions > LabConstrictor tools...
      detail: A prototype for QuPath 0.7. The image open in QuPath is exported for the tool, and points and outlines come back onto the slide. Not shown on this page.
  note: Each program has its own plugin, and all three run the same installed app. This website does not connect to a Fiji or napari running on your computer. Everything on this page is a simulation built from one precomputed result.
