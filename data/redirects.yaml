# Old address -> new address, both relative to the site root and ending with a slash. Add a line whenever a page is
# renamed or moved (a template doc renamed in the template changes its guide address), so existing links keep working.
# Example:  guides/old-name/: guides/new-name/
redirects:
  guides/use-cases/: apps/   # template 0.1.36 removed its page of examples; the App Centre lists every app
  apps/labconstrictor-demo/: apps/labconstrictor-playground/   # the Demo app was retired; the Playground shows everything it did and more
